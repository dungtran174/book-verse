# ============================================
# BookVerse - Cấu hình Development (H2)
# ============================================
spring:
  config:
    activate:
      on-profile: dev

  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:bookverse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (truy cập tại /h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA - tự động tạo bảng từ Entity
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  # Tự động chạy data.sql khi khởi động
  sql:
    init:
      mode: always

# Logging
logging:
  level:
    com.bookverse: DEBUG
    org.springframework.web: DEBUG
