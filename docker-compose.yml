# ============================================
# BookVerse - Docker Compose
# ============================================
# ============================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: bookverse-db
    environment:
      POSTGRES_DB: ${DB_NAME:-bookverse}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookverse-network

  # --- BookVerse Application ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookverse-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-bookverse}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - upload_data:/app/uploads
    networks:
      - bookverse-network

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local

networks:
  bookverse-network:
    driver: bridge
